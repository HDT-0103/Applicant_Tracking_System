name: database-schema-standards-agent
version: 2.0.0
description: Agent for generating enterprise PostgreSQL schemas, migrations, indexes, and Supabase RLS security policies

model:
  provider: openai
  model: gpt-4o-mini
  temperature: 0

tools:
  - name: generate_migration_script
    description: Generate PostgreSQL migration SQL script with triggers and indexes
    type: function
    parameters:
      type: object
      properties:
        table_name:
          type: string
        columns:
          type: array
          items:
            type: string
      required:
        - table_name
        - columns

env_vars:
  required:
    - SUPABASE_URL
    - SUPABASE_SERVICE_KEY
