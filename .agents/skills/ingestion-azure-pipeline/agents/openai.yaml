name: ingestion-azure-pipeline-agent
version: 2.0.0
description: Agent for handling PDF resume validation, Azure Blob Storage uploads, and Azure Service Bus messaging

model:
  provider: openai
  model: gpt-4o-mini
  temperature: 0

tools:
  - name: validate_pdf_file
    description: Validate PDF magic bytes (%PDF) and file size boundary limits (<=10MB)
    type: function
    parameters:
      type: object
      properties:
        file_bytes:
          type: string
        filename:
          type: string
      required:
        - file_bytes
        - filename

  - name: upload_blob_storage
    description: Upload PDF file to Azure Blob Storage container candidate-cvs
    type: function
    parameters:
      type: object
      properties:
        container_name:
          type: string
          default: candidate-cvs
        blob_name:
          type: string
        file_content:
          type: string
      required:
        - blob_name
        - file_content

  - name: publish_service_bus_event
    description: Publish event message to Azure Service Bus queue cv-received-queue
    type: function
    parameters:
      type: object
      properties:
        queue_name:
          type: string
          default: cv-received-queue
        event_payload:
          type: object
      required:
        - event_payload

  - name: create_candidate_record
    description: Create candidate record in Supabase
    type: function
    parameters:
      type: object
      properties:
        full_name:
          type: string
        email:
          type: string
        phone:
          type: string
        linkedin_url:
          type: string
        github_username:
          type: string
      required:
        - full_name
        - email

env_vars:
  required:
    - AZURE_STORAGE_CONNECTION_STRING
    - AZURE_SERVICE_BUS_CONNECTION_STRING
    - SUPABASE_URL
    - SUPABASE_SERVICE_KEY
