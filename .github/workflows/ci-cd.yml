name: SmartATS Continuous Integration & Deployment

on:
  # Chạy trên MỌI nhánh, không chỉ main/develop — trước đây push lên
  # feature/* không kích hoạt gì cả nên lỗi chỉ lộ ra lúc mở PR.
  push:
  pull_request:
    branches: [ "main", "develop" ]

# Push mới lên cùng một nhánh sẽ huỷ lần chạy cũ còn dở, đỡ xếp hàng.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # JOB 1: KIỂM THỬ VÀ LÀM SẠCH BACKEND (FASTAPI)
  # ==========================================
  backend-ci:
    runs-on: ubuntu-latest
    # KHÔNG đặt working-directory: src/backend.
    #
    # `requirements.txt` và `conftest.py` đều nằm ở GỐC repo. Chạy từ
    # src/backend thì bước cài thư viện chết ngay với "Could not open
    # requirements file", nên job này chưa từng chạy qua nổi bước đầu tiên.
    #
    # Chạy từ gốc còn được thêm một thứ: repo có HAI thư mục test
    # (`tests/` và `src/backend/tests/`), và pytest ở gốc gom cả hai trong một
    # lượt. Trước đây chỉ một nửa được chạy.

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Thiếu file thì phải fail NGAY tại đây, đừng để job đi tiếp rồi gãy ở
        # pytest với một ModuleNotFoundError khó truy.
        pip install -r requirements.txt

    - name: Run Code Linter (Flake8)
      run: |
        # Lỗi cú pháp hoặc tên chưa định nghĩa thì dừng build.
        flake8 src/backend --count --select=E9,F63,F7,F82 --show-source --statistics
        # Phần định dạng chỉ cảnh báo.
        flake8 src/backend --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Backend Tests (PyTest)
      env:
        # `Settings` đọc biến môi trường NGAY LÚC IMPORT, nên thiếu bất kỳ biến
        # bắt buộc nào là pytest chết ở khâu THU THẬP test — không một test nào
        # chạy, và thông báo lỗi (`SupabaseException`) không chỉ ra biến nào
        # thiếu. Đây chính là lý do job này trước đây luôn đỏ.
        #
        # Giá trị giả, cố ý: CI KHÔNG được cầm khoá vào cơ sở dữ liệu thật.
        # Test nào cần DB thật đã tự bỏ qua (xem tests/integration/conftest.py).
        SUPABASE_URL: "https://ci-placeholder.supabase.co"
        SUPABASE_ANON_KEY: "ci-placeholder-anon-key"
        SUPABASE_SERVICE_ROLE_KEY: "ci-placeholder-service-role-key"
        JWT_SECRET: "ci-placeholder-jwt-secret"
        DATABASE_URL: "postgresql+psycopg://test:test@localhost:5432/test_db"
      run: pytest -q

  # ==========================================
  # JOB 2: KIỂM THỬ VÀ BUILD FRONTEND (NEXT.JS)
  # ==========================================
  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: . # package.json nằm ở ROOT repo; Next build source trong src/frontend

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: 'npm' # Tự động cache node_modules
        cache-dependency-path: package-lock.json

    - name: Install Frontend Dependencies
      run: npm ci # Sử dụng 'ci' thay vì 'install' để đảm bảo cài đúng version trong package-lock.json

    - name: Check Code Quality & Formatting
      run: npm run lint --if-present

    - name: Run Frontend Unit Tests (Vitest)
      run: npm test

    - name: Build Next.js Application
      # `.env` nằm trong .gitignore nên runner không bao giờ có file này; script
      # build dùng `env-cmd --silent` để bỏ qua thay vì gãy. Biến công khai cần
      # cho build thì khai báo thẳng ở đây.
      env:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      run: npm run build

  # ==========================================
  # JOB 3: KIỂM TRA ĐÓNG GÓI (chạy trên MỌI nhánh)
  # ==========================================
  # Build image thật thay vì chỉ `echo`. Dockerfile hỏng là loại lỗi chỉ lộ ra
  # lúc triển khai — muộn nhất có thể — nên để CI phát hiện, kể cả khi chưa có
  # nơi nào để đẩy image lên.
  docker-build:
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Build backend image
      run: docker build -t smartats-backend:${{ github.sha }} .

    - name: Container khởi động được và /health trả lời
      env:
        SUPABASE_URL: "https://ci-placeholder.supabase.co"
        SUPABASE_ANON_KEY: "ci-placeholder-anon-key"
        SUPABASE_SERVICE_ROLE_KEY: "ci-placeholder-service-role-key"
        JWT_SECRET: "ci-placeholder-jwt-secret"
      run: |
        # Build xong không có nghĩa là chạy được: sai entrypoint, thiếu biến
        # bắt buộc, hay một import ở tầng module đều chỉ lộ ra lúc khởi động.
        docker run -d --name smoke -p 8000:8000 \
          -e SUPABASE_URL -e SUPABASE_ANON_KEY -e SUPABASE_SERVICE_ROLE_KEY -e JWT_SECRET \
          smartats-backend:${{ github.sha }}
        for i in $(seq 1 30); do
          if curl -sf http://localhost:8000/health; then
            echo ""; echo "Container trả lời /health."; docker rm -f smoke; exit 0
          fi
          sleep 2
        done
        echo "Container không phản hồi /health sau 60 giây. Log:"
        docker logs smoke
        docker rm -f smoke
        exit 1

  # ==========================================
  # JOB 4: TRIỂN KHAI
  # ==========================================
  deploy:
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: CHƯA CẤU HÌNH TRIỂN KHAI
      run: |
        echo "::warning title=Chưa có bước triển khai::CI đã pass, nhưng repo"
        echo "::warning::chưa có bước đẩy lên môi trường nào. Đây KHÔNG phải là"
        echo "::warning::một lần deploy — image chỉ được build và kiểm tra."
        echo ""
        echo "Muốn bật triển khai thật, cần thêm ở job này:"
        echo "  1. azure/login@v2 với secret AZURE_CREDENTIALS"
        echo "  2. Đẩy image lên registry (ACR / GHCR)"
        echo "  3. azure/webapps-deploy@v3 hoặc tương đương"
        echo "  4. Nạp biến môi trường production từ secret, KHÔNG dùng .env"
