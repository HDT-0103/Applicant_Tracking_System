name: SmartATS Continuous Integration & Deployment

on:
  # Chạy trên MỌI nhánh, không chỉ main/develop — trước đây push lên
  # feature/* không kích hoạt gì cả nên lỗi chỉ lộ ra lúc mở PR.
  push:
  pull_request:
    branches: [ "main", "develop" ]

# Push mới lên cùng một nhánh sẽ huỷ lần chạy cũ còn dở, đỡ xếp hàng.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # JOB 1: KIỂM THỬ VÀ LÀM SẠCH BACKEND (FASTAPI)
  # ==========================================
  backend-ci:
    runs-on: ubuntu-latest
    # KHÔNG đặt working-directory: src/backend.
    #
    # `requirements.txt` và `conftest.py` đều nằm ở GỐC repo. Chạy từ
    # src/backend thì bước cài thư viện chết ngay với "Could not open
    # requirements file", nên job này chưa từng chạy qua nổi bước đầu tiên.
    #
    # Chạy từ gốc còn được thêm một thứ: repo có HAI thư mục test
    # (`tests/` và `src/backend/tests/`), và pytest ở gốc gom cả hai trong một
    # lượt. Trước đây chỉ một nửa được chạy.

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Thiếu file thì phải fail NGAY tại đây, đừng để job đi tiếp rồi gãy ở
        # pytest với một ModuleNotFoundError khó truy.
        pip install -r requirements.txt

    - name: Run Code Linter (Flake8)
      run: |
        # Lỗi cú pháp hoặc tên chưa định nghĩa thì dừng build.
        flake8 src/backend --count --select=E9,F63,F7,F82 --show-source --statistics
        # Phần định dạng chỉ cảnh báo.
        flake8 src/backend --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Backend Tests (PyTest)
      env:
        # `Settings` đọc biến môi trường NGAY LÚC IMPORT, nên thiếu bất kỳ biến
        # bắt buộc nào là pytest chết ở khâu THU THẬP test — không một test nào
        # chạy, và thông báo lỗi (`SupabaseException`) không chỉ ra biến nào
        # thiếu. Đây chính là lý do job này trước đây luôn đỏ.
        #
        # Giá trị giả, cố ý: CI KHÔNG được cầm khoá vào cơ sở dữ liệu thật.
        # Test nào cần DB thật đã tự bỏ qua (xem tests/integration/conftest.py).
        SUPABASE_URL: "https://ci-placeholder.supabase.co"
        SUPABASE_ANON_KEY: "ci-placeholder-anon-key"
        SUPABASE_SERVICE_ROLE_KEY: "ci-placeholder-service-role-key"
        JWT_SECRET: "ci-placeholder-jwt-secret"
        DATABASE_URL: "postgresql+psycopg://test:test@localhost:5432/test_db"
      run: pytest -q

  # ==========================================
  # JOB 2: KIỂM THỬ VÀ BUILD FRONTEND (NEXT.JS)
  # ==========================================
  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: . # package.json nằm ở ROOT repo; Next build source trong src/frontend

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: 'npm' # Tự động cache node_modules
        cache-dependency-path: package-lock.json

    - name: Install Frontend Dependencies
      run: npm ci # Sử dụng 'ci' thay vì 'install' để đảm bảo cài đúng version trong package-lock.json

    - name: Check Code Quality & Formatting
      run: npm run lint --if-present

    - name: Run Frontend Unit Tests (Vitest)
      run: npm test

    - name: Build Next.js Application
      # `.env` nằm trong .gitignore nên runner không bao giờ có file này; script
      # build dùng `env-cmd --silent` để bỏ qua thay vì gãy. Biến công khai cần
      # cho build thì khai báo thẳng ở đây.
      env:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      run: npm run build

  # ==========================================
  # JOB 3: KIỂM TRA ĐÓNG GÓI (chạy trên MỌI nhánh)
  # ==========================================
  # Build image thật thay vì chỉ `echo`. Dockerfile hỏng là loại lỗi chỉ lộ ra
  # lúc triển khai — muộn nhất có thể — nên để CI phát hiện, kể cả khi chưa có
  # nơi nào để đẩy image lên.
  docker-build:
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Build backend image
      # BAKE_MODEL=false: KHÔNG nạp mô hình nhúng 1,1 GB vào image ở job này.
      #
      # Job này chỉ trả lời một câu hỏi: image build được và container khởi
      # động được không. Không phép kiểm nào ở đây chạm tới mô hình, nên nạp
      # nó chỉ tốn ~20 phút runner cho mỗi push của MỌI nhánh — và hạn mức
      # GitHub Actions là thứ có thật.
      #
      # Job `deploy` bên dưới build LẠI với mặc định BAKE_MODEL=true, nên bản
      # lên production vẫn có mô hình nằm sẵn trong image.
      run: docker build --build-arg BAKE_MODEL=false -t smartats-backend:${{ github.sha }} .

    - name: Container khởi động được và /health trả lời
      env:
        SUPABASE_URL: "https://ci-placeholder.supabase.co"
        SUPABASE_ANON_KEY: "ci-placeholder-anon-key"
        SUPABASE_SERVICE_ROLE_KEY: "ci-placeholder-service-role-key"
        JWT_SECRET: "ci-placeholder-jwt-secret"
      run: |
        # Build xong không có nghĩa là chạy được: sai entrypoint, thiếu biến
        # bắt buộc, hay một import ở tầng module đều chỉ lộ ra lúc khởi động.
        docker run -d --name smoke -p 8000:8000 \
          -e SUPABASE_URL -e SUPABASE_ANON_KEY -e SUPABASE_SERVICE_ROLE_KEY -e JWT_SECRET \
          smartats-backend:${{ github.sha }}
        for i in $(seq 1 30); do
          if curl -sf http://localhost:8000/health; then
            echo ""; echo "Container trả lời /health."; docker rm -f smoke; exit 0
          fi
          sleep 2
        done
        echo "Container không phản hồi /health sau 60 giây. Log:"
        docker logs smoke
        docker rm -f smoke
        exit 1

  # ==========================================
  # JOB 4: TRIỂN KHAI LÊN AZURE CONTAINER APPS
  # ==========================================
  # Chỉ chạy khi push vào main VÀ đã cấu hình đủ secret. Thiếu secret thì job
  # bị bỏ qua chứ không đỏ — người chưa dựng hạ tầng Azure không phải nhìn CI
  # đỏ vì một thứ họ chưa định làm.
  #
  # Xem docs/DEPLOY.md cho các lệnh dựng hạ tầng lần đầu.
  deploy:
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Kiểm tra đã cấu hình Azure chưa
      id: guard
      env:
        AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      run: |
        if [ -z "$AZURE_CREDENTIALS" ]; then
          echo "::warning title=Chưa cấu hình triển khai::Thiếu secret AZURE_CREDENTIALS — bỏ qua bước deploy. Xem docs/DEPLOY.md."
          echo "configured=false" >> "$GITHUB_OUTPUT"
        else
          echo "configured=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Checkout Source Code
      if: steps.guard.outputs.configured == 'true'
      uses: actions/checkout@v4

    - name: Đăng nhập Azure
      if: steps.guard.outputs.configured == 'true'
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Đăng nhập Container Registry
      if: steps.guard.outputs.configured == 'true'
      run: az acr login --name ${{ secrets.ACR_NAME }}

    - name: Build và đẩy image
      if: steps.guard.outputs.configured == 'true'
      run: |
        REGISTRY="${{ secrets.ACR_NAME }}.azurecr.io"
        IMAGE="$REGISTRY/smartats-backend"
        # Gắn cả SHA lẫn latest: SHA để quay lui về đúng một bản build, latest
        # để người vận hành gõ tay cho nhanh.
        docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
        docker push "$IMAGE:${{ github.sha }}"
        docker push "$IMAGE:latest"

    - name: Triển khai lên Container Apps
      if: steps.guard.outputs.configured == 'true'
      run: |
        REGISTRY="${{ secrets.ACR_NAME }}.azurecr.io"
        # Chỉ đổi image. Biến môi trường và secret đã đặt sẵn trên Container
        # App lúc dựng hạ tầng — CI không được cầm chúng, và cũng không nên
        # ghi đè cấu hình runtime mỗi lần deploy.
        az containerapp update \
          --name ${{ secrets.AZURE_CONTAINER_APP }} \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --image "$REGISTRY/smartats-backend:${{ github.sha }}"

    - name: Chờ revision mới trả lời /health
      if: steps.guard.outputs.configured == 'true'
      run: |
        FQDN=$(az containerapp show \
          --name ${{ secrets.AZURE_CONTAINER_APP }} \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --query properties.configuration.ingress.fqdn -o tsv)

        # `az containerapp update` trả về ngay khi Azure NHẬN yêu cầu, không
        # phải khi revision mới đã phục vụ được. Không chờ ở đây thì CI báo
        # xanh trong khi bản deploy có thể đang crash-loop.
        for i in $(seq 1 40); do
          if curl -sf "https://$FQDN/health" > /dev/null; then
            echo "Đã lên: https://$FQDN"
            exit 0
          fi
          sleep 15
        done

        echo "::error title=Deploy không phản hồi::Revision mới không trả lời /health sau 10 phút."
        az containerapp logs show \
          --name ${{ secrets.AZURE_CONTAINER_APP }} \
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
          --tail 60
        exit 1
