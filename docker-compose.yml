# Chạy backend trong container, dùng Supabase làm cơ sở dữ liệu.
#
#   cp .env.example .env   # rồi điền vào
#   docker compose up --build
#   curl localhost:8000/health
#
# Frontend KHÔNG nằm ở đây: `npm run dev` đủ nhanh và tiện hơn cho vòng lặp
# phát triển. File này chỉ để kiểm tra rằng đúng thứ sẽ được triển khai —
# image backend — thật sự chạy được.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ats_backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

# ĐÃ GỠ: service `db` (pgvector/pgvector:pg16).
#
# Ứng dụng đã chuyển sang Supabase — `modules/shared/infrastructure/`
# nói chuyện với PostgREST, không với một Postgres cục bộ. Container kia dựng
# lên rồi nằm không, còn `init.sql` mà nó nạp thì đã lạc hậu so với các
# migration V002–V008.
#
# ĐÃ GỠ: `volumes: - ./backend:/app`.
#
# Thư mục `./backend` KHÔNG TỒN TẠI (code nằm ở `src/backend`). Docker sẽ tự
# tạo nó rỗng rồi gắn đè lên `/app`, xoá sạch phần code mà Dockerfile vừa COPY
# vào — container bật lên là trống trơn. Bind mount kiểu này chỉ hợp với vòng
# lặp dev có --reload, mà `CMD` trong Dockerfile cố ý không bật --reload.
